services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.122.1
    command: ["--config=/etc/otelcol/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC (apps -> collector)
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus exporter (collector metrics -> prometheus)
    depends_on:
      - loki
      - tempo

  loki:
    image: grafana/loki:3.3.2
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200" # Tempo query
      - "4317" # evita conflito com o collector no host (OTLP interno via rede compose)
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - tempo
      - prometheus

  # Alternativa rápida ao Grafana: dashboard Aspire standalone (sem projeto AppHost).
  # Perfis: use --profile aspire para subir só ele (+ nada mais), ou o default p/ Grafana.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.4
    profiles: ["aspire"]
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    ports:
      - "18889:18889" # OTLP gRPC (apps -> dashboard, via OTEL_EXPORTER_OTLP_ENDPOINT)
      - "18890:18890" # OTLP HTTP
      - "8081:8080" # Dashboard web
